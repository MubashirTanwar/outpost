# Full stack, locally:  docker compose up --build
# With a free local LLM: docker compose --profile ollama up --build
#   (then once: docker compose exec ollama ollama pull llama3.1)
services:
  neo4j:
    image: neo4j:5.26-community
    environment:
      NEO4J_AUTH: neo4j/chesscoach
    ports:
      - "7474:7474" # browser UI: http://localhost:7474
      - "7687:7687"
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      retries: 30

  api:
    build: ./backend
    environment:
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: chesscoach
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ENGINE_DEPTH: ${ENGINE_DEPTH:-18}
      ENGINE_THREADS: ${ENGINE_THREADS:-2}
    ports:
      - "8000:8000"
    depends_on:
      neo4j:
        condition: service_healthy

  web:
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  ollama:
    image: ollama/ollama:latest
    profiles: ["ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

volumes:
  neo4j-data:
  ollama-data:
